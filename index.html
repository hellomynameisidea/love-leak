function intro(){
let c=C();
render(`<div class="view"><div class="hero"><div class="idea">IDEA</div><div class="label">НОВОЕ ОБРАЩЕНИЕ · CASE ${String(c.id).padStart(2,"0")}</div><h1>${c.title}</h1><p>${c.desc}</p><div class="notice" style="text-align:left;margin-top:20px"><b>Сообщение от заявителя</b><br><br>«Мне нужна помощь. Я не хочу делать выводы на эмоциях, поэтому обращаюсь к IDEA. Я передаю вам доступ к телефону. Проверьте сообщения, фотографии и аккаунты. Если мои подозрения ошибочны — скажите мне честно».</div><button class="btn primary" onclick="lock()">Получить устройство</button><button class="btn" onclick="menu()">Вернуться к делам</button></div></div>`)
}
function lock(){
let c=C();
render(`<div class="view lock"><div class="time">${new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}</div><div class="small">Сегодня · устройство заявителя</div><div class="avatar" style="margin:28px auto 10px;background:#222;color:#fff;display:grid;place-items:center;font-size:25px"></div><b>iPhone</b><div class="muted">PIN передан заявителем IDEA</div><div class="pin">${[0,1,2,3].map(i=>`<i class="dot ${S.pin.length>i?"on":""}"></i>`).join("")}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="key" onclick="digit(${n})">${n}</button>`).join("")}</div><button class="btn" style="width:230px" onclick="menu()">Отмена</button></div>`)
}
function digit(n){S.pin+=n;if(S.pin.length===4){if(S.pin===C().pin){S.unlocked=true;save();home()}else{alert("Неверный PIN");S.pin=""}}if(!S.unlocked)lock()}
const apps=[["💬","Сообщения","messages"],["📷","Фото","photos"],["◎","LIFE","insta"],["📞","Телефон","calls"],["📝","Заметки","notes"],["📁","Файлы","files"],["🌐","Safari","browser"],["🗺️","Карты","maps"],["👥","Контакты","contacts"],["🗑️","Недавно","deleted"],["🧩","Улики","evidence"],["🕵️","IDEA","idea"]];
function home(){
let c=C();
render(`<div class="view"><div class="home"><div class="wall"><div class="date">${new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</div><h2>${c.people[1]}</h2><div class="small">устройство в режиме расследования IDEA</div></div><div class="icons">${apps.map(a=>`<button class="app" onclick="app('${a[2]}')"><div class="appicon">${a[0]}</div><small>${a[1]}</small></button>`).join("")}</div><div class="dock"><span>📞</span><span>💬</span><span>◎</span><span>🌐</span></div></div></div>`)
}
function head(title){return `<div class="top"><button class="back" onclick="home()">‹</button><div><h1>${title}</h1><div class="small">${C().people[1]} · iPhone</div></div></div>`}
function app(t){
let c=C(),b="";
if(t==="messages")b=`<div class="bubble me">Ты где? Уже поздно.</div><div class="bubble">Я дома. Не жди меня.</div><div class="bubble deleted">🗑️ УДАЛЕНО<br>«Не пиши сюда. Она может увидеть.»</div><div class="bubble">Артём: 23:17 — Я буду у входа.</div><div class="bubble me">Ты говорил, что не знаешь его.</div>`;
else if(t==="photos")b=`<div class="photoGrid">${c.photos.map((p,i)=>`<img src="${p[2]}" alt="${p[0]}" onclick="openPhoto('${p[2]}','${p[0]}');add('Фото: ${p[0]}')">`).join("")}</div>`;
else if(t==="insta")b=insta(c);
else if(t==="calls")b=`<div class="photoCard"><b>23:17 · ${c.people[2]}</b><div class="muted">исходящий · 08:42</div></div><div class="photoCard"><b>00:03 · ${c.people[0]}</b><div class="muted">входящий · 00:18</div></div>`;
else if(t==="notes")b=`<div class="photoCard"><div class="label">Заметка</div><h3>Не говорить до пятницы</h3><p class="muted">Если спросит — был дома. Архив: ${c.pin}</p></div>`;
else if(t==="files")b=`<div class="notice"><b>🔐 Hidden Archive</b><p>Некоторые файлы защищены PIN. Это тот же код, который заявитель передал IDEA.</p><input class="input" id="fp" inputmode="numeric" placeholder="PIN"><button class="btn primary" onclick="openArchive()">Открыть</button></div>`;
else if(t==="browser")b=`<div class="photoCard"><b>История посещений</b><div class="muted">23:05 · maps.example<br>23:11 · life.example/${c.people[2].toLowerCase()}<br>00:22 · hotel.example</div></div>`;
else if(t==="maps")b=`<div class="photoCard"><div class="label">Последняя геолокация</div><h3>📍 Алматы</h3><p class="muted">23:17 · координаты совпадают с фотографией из галереи.</p><button class="btn" onclick="add('Геолокация 23:17')">Добавить в улики</button></div>`;
else if(t==="contacts")b=`<div class="photoCard"><b>${c.people[0]}</b><div class="muted">Любимая · 00:03</div></div><div class="photoCard"><b>${c.people[2]}</b><div class="muted">Новый контакт · скрыт из избранного</div></div>`;
else if(t==="deleted")b=`<div class="photoCard"><b>Недавно удалённое</b><p class="muted">3 фотографии · 2 сообщения</p><button class="btn" onclick="add('Удалённые данные')">Восстановить и добавить улику</button></div>`;
else if(t==="evidence")b=`<div class="photoCard"><b>Улик собрано: ${S.found.length}</b><div class="muted">Улики появляются только после твоих действий.</div></div>${S.found.map(x=>`<div class="photoCard">✓ ${x}</div>`).join("")}`;
else if(t==="idea")b=`<div class="notice"><b>IDEA · Рабочее дело</b><p>Заявитель передал устройство для проверки. Собирай факты, не делай выводы раньше времени.</p><button class="btn primary" onclick="tasks()">Перейти к заданиям</button></div>`;
render(`<div class="view">${head(t==="insta"?"LIFE":t==="idea"?"IDEA":t)}<div class="pad">${b}</div></div>`)
}
function insta(c){
return `<div class="instaHead"><img class="avatar" src="${c.photos[0][2]}"><div><b>@${c.people[1].toLowerCase()}</b><div class="small">${c.people[1]} · ${c.photos.length*73} подписчиков</div></div></div><div class="instaPost"><img class="photo" src="${c.photos[1][2]}" onclick="openPhoto('${c.photos[1][2]}','Публикация')"><div class="like">♡ 184 отметки «Нравится»</div><div class="pad" style="padding-top:0"><b>${c.people[1]}</b> Сегодня было хорошо.</div><div class="muted pad" style="padding-top:0">Комментарии: «ты опять здесь?» · «кто был рядом?»</div></div><div class="instaPost"><img class="photo" src="${c.photos[3][2]}" onclick="openPhoto('${c.photos[3][2]}','Скрытая публикация')"><div class="like">♡ 67 отметок «Нравится»</div></div><button class="btn" onclick="add('Публикация LIFE')">Сохранить публикацию как улику</button>`;
}
function openPhoto(src,title){let d=document.createElement("div");d.className="fullPhoto";d.innerHTML=`<button class="close" onclick="this.parentNode.remove()">×</button><img src="${src}" alt="${title}">`;document.body.appendChild(d)}
function add(x){if(!S.found.includes(x)){S.found.push(x);save();alert("Улика сохранена в IDEA 🧩")}}
function openArchive(){if($("fp").value===C().pin){add("Hidden Archive");alert("Архив открыт")}else alert("Неверный PIN")}
function tasks(){
let c=C(),t=c.tasks[S.task],pct=Math.round(S.task/15*100);
if(!t){final();return}
let body=`<div class="bar"><i style="width:${pct}%"></i></div><div class="label">ЗАДАНИЕ ${S.task+1} / 15</div><h2 style="font-size:19px">${t[1]}</h2>`;
if(t[0]==="q")body+=t[2].map((x,i)=>`<button class="btn choice" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join("");
else body+=`<input class="input" id="ans" placeholder="Введите ответ"><button class="btn primary" onclick="typed()">Проверить</button>`;
render(`<div class="view">${head("IDEA · расследование")}<div class="pad">${body}<div style="height:35px"></div></div></div>`)
}
function answer(i){let t=C().tasks[S.task];S.answers.push(i===t[3]);S.task++;save();if(i!==t[3])alert("Не совпало. Проверь телефон ещё раз.");tasks()}
function typed(){let t=C().tasks[S.task],a=$("ans").value.trim().toLowerCase().replaceAll("ё","е"),r=String(t[2]).toLowerCase().replaceAll("ё","е");S.answers.push(a===r);S.task++;save();if(a!==r)alert("Ответ не совпал с найденными данными.");tasks()}
function final(){
let c=C();
render(`<div class="view">${head("Финальный вывод")}<div class="pad"><div class="notice"><div class="label">IDEA · ФИНАЛ</div><h2>${c.title}</h2><p>${c.result}</p><p class="muted">Собрано улик: ${S.found.length} · правильных ответов: ${S.answers.filter(Boolean).length}/15</p></div><input class="input" id="finalname" placeholder="Имя ключевого человека"><input class="input" id="finaltruth" placeholder="да / нет"><button class="btn primary" onclick="finish()">Сформировать обвинение</button></div></div>`)
}
function finish(){
let c=C(),n=$("finalname").value.trim().toLowerCase(),truth=$("finaltruth").value.trim().toLowerCase(),target=c.people[2].toLowerCase(),expected=c.id===1||c.id===3?"да":"нет";
let ok=n===target&&truth===expected;
render(`<div class="view">${head("Результат")}<div class="pad"><div class="notice"><div class="label">${ok?"ДЕЛО РАСКРЫТО":"ДАННЫХ НЕДОСТАТОЧНО"}</div><h2>${ok?"Вывод подтверждён":"Нельзя обвинять без достаточных доказательств"}</h2><p>${c.result}</p></div><button class="btn primary" onclick="menu()">Вернуться к делам</button></div></div>`)
}
function start(){S.id&&S.unlocked?home():S.id?intro():menu()}start();
</script></body></html>
