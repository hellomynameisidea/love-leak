 let c=C(),name=$("name").value.trim().toLowerCase(),yes=$("yes").value.trim().toLowerCase(),ok=name===c.clue.toLowerCase()&&yes===c.truth,score=S.answers.filter(Boolean).length;
 show(`<div class="view">${head("Развязка")}<div class="pad"><div class="card"><h2>${ok?"🟣 Дело раскрыто":"🟠 Дело не доказано"}</h2><p>${esc(c.ending)}</p></div><div class="card"><b>Результат</b><div class="muted">Правильных заданий: ${score}/15<br>Собрано улик: ${S.found.length}</div></div><button class="btn primary" onclick="cases()">Следующее дело</button></div></div>`)
}
function start(){S.caseId?(S.locked?lock():desk()):cases()}start();
</script>
